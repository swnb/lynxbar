name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example, 0.1.0); defaults to tag or project.yml version"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Verify localization parity
        run: |
          plutil -lint \
            Sources/LynxBar/Resources/en.lproj/Localizable.strings \
            Sources/LynxBar/Resources/zh-Hans.lproj/Localizable.strings
          python3 - <<'PY'
          import plistlib
          import re
          import subprocess
          import sys

          en_path = "Sources/LynxBar/Resources/en.lproj/Localizable.strings"
          zh_path = "Sources/LynxBar/Resources/zh-Hans.lproj/Localizable.strings"

          def find_duplicates(path: str) -> list[str]:
              with open(path, encoding="utf-8") as f:
                  text = f.read()
              text = re.sub(r"/\*.*?\*/", "", text, flags=re.S)
              text = re.sub(r"//.*", "", text)
              keys = re.findall(r'"((?:\\.|[^"\\])*)"\s*=', text)
              seen: set[str] = set()
              dups: list[str] = []
              for key in keys:
                  if key in seen:
                      dups.append(key)
                  seen.add(key)
              return dups

          def load_strings(path: str) -> dict[str, str]:
              xml = subprocess.check_output(["plutil", "-convert", "xml1", "-o", "-", path])
              return plistlib.loads(xml)

          for path in (en_path, zh_path):
              dups = find_duplicates(path)
              if dups:
                  print(f"Duplicate localization keys in {path}: {dups}", file=sys.stderr)
                  sys.exit(1)

          en = load_strings(en_path)
          zh = load_strings(zh_path)
          only_en = sorted(set(en) - set(zh))
          only_zh = sorted(set(zh) - set(en))
          if only_en or only_zh:
              print(f"Missing in zh-Hans: {only_en}", file=sys.stderr)
              print(f"Missing in en: {only_zh}", file=sys.stderr)
              sys.exit(1)

          spec_re = re.compile(r"%(?:\d+\$)?(?:\.\d+)?(?:ll|l)?[@difuxs]|%%")
          mismatches = []
          for key in sorted(en):
              en_specs = sorted(m.group(0) for m in spec_re.finditer(en[key]) if m.group(0) != "%%")
              zh_specs = sorted(m.group(0) for m in spec_re.finditer(zh[key]) if m.group(0) != "%%")
              if en_specs != zh_specs:
                  mismatches.append((key, en_specs, zh_specs))
          if mismatches:
              print(f"Format specifier mismatches: {mismatches}", file=sys.stderr)
              sys.exit(1)

          print(f"Localization parity OK: {len(en)} aligned keys.")
          PY

      - name: Build for testing (0-warning gate)
        run: |
          set -o pipefail
          xcodebuild \
            -project LynxBar.xcodeproj \
            -scheme LynxBar \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing 2>&1 | tee build.log

      - name: Fail on warnings
        run: |
          if grep -q ": warning:" build.log; then
            echo "::error::Debug build emitted compiler warnings; zero-warning baseline is required."
            grep ": warning:" build.log | sort -u
            exit 1
          fi

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project LynxBar.xcodeproj \
            -scheme LynxBar \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            test-without-building

      - name: Resolve release configuration
        id: config
        env:
          INPUT_VERSION: ${{ inputs.version }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="${INPUT_VERSION#v}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(awk -F'"' '/MARKETING_VERSION:/ { print $2; exit }' project.yml)"
            VERSION="${VERSION:-0.1.0}"
          fi

          if [[ -n "$APPLE_CERTIFICATE_P12" && -n "$APPLE_CERTIFICATE_PASSWORD" && -n "$APPLE_TEAM_ID" && -n "$APPLE_ID" && -n "$APPLE_APP_PASSWORD" ]]; then
            SIGNED="true"
          else
            SIGNED="false"
          fi

          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Release version=$VERSION signed=$SIGNED prerelease=$PRERELEASE"

      - name: Import Developer ID certificate
        if: steps.config.outputs.signed == 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          mkdir -p build
          KEYCHAIN_PATH="$PWD/build/signing.keychain-db"
          CERT_PATH="$PWD/build/certificate.p12"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "CERT_PATH=$CERT_PATH" >> "$GITHUB_ENV"

          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Archive, export, notarize, and package signed universal release
        if: steps.config.outputs.signed == 'true'
        env:
          VERSION: ${{ steps.config.outputs.version }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -o pipefail
          mkdir -p build dist

          cat > build/exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>method</key>
          	<string>developer-id</string>
          	<key>teamID</key>
          	<string>${APPLE_TEAM_ID}</string>
          	<key>signingStyle</key>
          	<string>manual</string>
          	<key>signingCertificate</key>
          	<string>Developer ID Application</string>
          </dict>
          </plist>
          EOF
          plutil -lint build/exportOptions.plist

          xcodebuild \
            -project LynxBar.xcodeproj \
            -scheme LynxBar \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/LynxBar.xcarchive \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            archive 2>&1 | tee build/release-build.log

          if grep -q ": warning:" build/release-build.log; then
            echo "::error::Release build emitted compiler warnings; zero-warning baseline is required."
            grep ": warning:" build/release-build.log | sort -u
            exit 1
          fi

          xcodebuild \
            -exportArchive \
            -archivePath build/LynxBar.xcarchive \
            -exportOptionsPlist build/exportOptions.plist \
            -exportPath build/export

          APP="build/export/LynxBar.app"
          [[ -d "$APP" ]] || { echo "Missing exported app at $APP"; exit 1; }

          ARCHS_OUT="$(lipo -archs "$APP/Contents/MacOS/LynxBar")"
          echo "Verified Universal architectures: $ARCHS_OUT"
          [[ "$ARCHS_OUT" == *"arm64"* && "$ARCHS_OUT" == *"x86_64"* ]] || {
            echo "::error::Expected universal binary (arm64 + x86_64), got: $ARCHS_OUT"
            exit 1
          }
          codesign --verify --deep --strict "$APP"

          ZIP="dist/LynxBar-${VERSION}-universal.zip"
          ditto -c -k --keepParent "$APP" "$ZIP"
          xcrun notarytool submit "$ZIP" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

          # Repackage stapled app into final ZIP and compressed UDZO DMG with Applications shortcut.
          rm -f "$ZIP"
          ditto -c -k --keepParent "$APP" "$ZIP"

          rm -rf build/dmg-root
          mkdir -p build/dmg-root
          ditto "$APP" build/dmg-root/LynxBar.app
          ln -s /Applications build/dmg-root/Applications
          DMG="dist/LynxBar-${VERSION}-universal.dmg"
          hdiutil create -volname "LynxBar ${VERSION}" -srcfolder build/dmg-root -ov -format UDZO "$DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

          (cd dist && shasum -a 256 "LynxBar-${VERSION}-universal.dmg" "LynxBar-${VERSION}-universal.zip" > SHA256SUMS.txt)

      - name: Clean up temporary keychain
        if: always() && steps.config.outputs.signed == 'true'
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" && -f "${KEYCHAIN_PATH}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "${CERT_PATH:-}" build/exportOptions.plist

      - name: Build unsigned universal fallback release (DMG + ZIP)
        if: steps.config.outputs.signed != 'true'
        env:
          VERSION: ${{ steps.config.outputs.version }}
        run: |
          set -o pipefail
          mkdir -p build dist

          xcodebuild \
            -project LynxBar.xcodeproj \
            -scheme LynxBar \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/release-dd \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=YES \
            build 2>&1 | tee build/release-build.log

          if grep -q ": warning:" build/release-build.log; then
            echo "::error::Release build emitted compiler warnings; zero-warning baseline is required."
            grep ": warning:" build/release-build.log | sort -u
            exit 1
          fi

          APP="build/release-dd/Build/Products/Release/LynxBar.app"
          [[ -d "$APP" ]] || { echo "Missing built app at $APP"; exit 1; }

          ARCHS_OUT="$(lipo -archs "$APP/Contents/MacOS/LynxBar")"
          echo "Verified Universal architectures: $ARCHS_OUT"
          [[ "$ARCHS_OUT" == *"arm64"* && "$ARCHS_OUT" == *"x86_64"* ]] || {
            echo "::error::Expected universal binary (arm64 + x86_64), got: $ARCHS_OUT"
            exit 1
          }
          codesign --verify --deep --strict "$APP"

          ZIP="dist/LynxBar-${VERSION}-universal-unsigned.zip"
          ditto -c -k --keepParent "$APP" "$ZIP"

          rm -rf build/dmg-root
          mkdir -p build/dmg-root
          ditto "$APP" build/dmg-root/LynxBar.app
          ln -s /Applications build/dmg-root/Applications
          DMG="dist/LynxBar-${VERSION}-universal-unsigned.dmg"
          hdiutil create -volname "LynxBar ${VERSION}" -srcfolder build/dmg-root -ov -format UDZO "$DMG"

          (cd dist && shasum -a 256 "LynxBar-${VERSION}-universal-unsigned.dmg" "LynxBar-${VERSION}-universal-unsigned.zip" > SHA256SUMS.txt)

      - name: Generate release notes
        env:
          VERSION: ${{ steps.config.outputs.version }}
          SIGNED: ${{ steps.config.outputs.signed }}
        run: |
          python3 - <<'PY'
          import os
          import re

          version = os.environ["VERSION"]
          signed = os.environ["SIGNED"] == "true"

          changelog_section = ""
          if os.path.exists("CHANGELOG.md"):
              with open("CHANGELOG.md", encoding="utf-8") as f:
                  text = f.read()
              pattern = rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)"
              match = re.search(pattern, text, flags=re.M | re.S)
              if match:
                  changelog_section = match.group(1).strip()

          suffix = "" if signed else "-unsigned"
          dmg_name = f"LynxBar-{version}-universal{suffix}.dmg"
          zip_name = f"LynxBar-{version}-universal{suffix}.zip"
          signing_label = "Developer ID signed & notarized" if signed else "Ad-hoc / Unsigned"

          lines = [f"## LynxBar v{version}", ""]
          if not signed:
              lines += [
                  "> **Unsigned Release Notice**: Apple Developer signing secrets were not configured for this build, so the artifacts below are ad-hoc signed and unnotarized.",
                  "> After dragging `LynxBar.app` to `/Applications`, clear macOS quarantine once before launching (or build directly from source with `make build`):",
                  "> ```sh",
                  "> xattr -dr com.apple.quarantine /Applications/LynxBar.app",
                  "> ```",
                  "",
              ]
          else:
              lines += [
                  "Signed with Developer ID, notarized by Apple, and stapled for **macOS 13.0+ (Universal: Apple Silicon & Intel)**.",
                  "",
              ]

          lines += [
              "### Downloads",
              "",
              "| Artifact | Format | Architecture | Signing |",
              "| --- | --- | --- | --- |",
              f"| `{dmg_name}` | Drag-to-Applications DMG | Universal (`arm64` + `x86_64`) | {signing_label} |",
              f"| `{zip_name}` | Direct `.app` ZIP archive | Universal (`arm64` + `x86_64`) | {signing_label} |",
              "| `SHA256SUMS.txt` | SHA-256 checksums | — | — |",
              "",
              "### Verify Checksums",
              "```sh",
              "shasum -a 256 -c SHA256SUMS.txt",
              "```",
              "",
          ]

          if changelog_section:
              lines += ["### What's Changed", "", changelog_section, ""]

          os.makedirs("build", exist_ok=True)
          with open("build/release-notes.md", "w", encoding="utf-8") as out:
              out.write("\n".join(lines))
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.config.outputs.tag }}
          name: LynxBar ${{ steps.config.outputs.tag }}
          body_path: build/release-notes.md
          prerelease: ${{ steps.config.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.config.outputs.prerelease != 'true' }}
          files: dist/*
