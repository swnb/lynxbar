name: Feature Request
description: Propose a new feature, metric, or AIUsageProvider for LynxBar
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement to **LynxBar**!
        LynxBar prioritizes native Apple system frameworks (zero third-party dependencies), honest metrics ("never show 0 when unknown"), and privacy by default.

  - type: dropdown
    id: module_area
    attributes:
      label: Module / Area
      options:
        - AI Quota Provider (AIUsageProvider)
        - System Monitor (CPU / Memory / Disk / Network / GPU / Battery / Thermal)
        - Trash-Safe Disk Cleanup
        - Menu Bar & Overview UI
        - Settings & Appearance
        - Localization / Documentation / CI
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve or what workflow would this improve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the desired UX, metric semantics, or provider behavior.
    validations:
      required: true

  - type: textarea
    id: privacy_considerations
    attributes:
      label: Privacy & System Boundary Considerations
      description: Does this require outbound network calls, elevated permissions, or new local credential reads? Should it be opt-in and off by default?
      placeholder: "e.g., Opt-in toggle (off by default), read-only local credentials, zero third-party dependencies..."
    validations:
      required: true
